[project]
name = "agent-os-quintessa"
version = "0.1.0"
description = "Agent OS (Quintessa): an LLM-driven reasoning loop over shared personal memory."
requires-python = ">=3.11"
dependencies = [
    "anthropic[vertex]>=1.0",
    "google-genai>=1.30",
    "google-play-scraper>=1.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quintessa*"]

[tool.setuptools.package-data]
quintessa = ["capabilities/*.md", "samples/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
