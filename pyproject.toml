[project]
name = "agent-os-quintessa"
version = "0.1.0"
description = "Agent OS (Quintessa): an LLM-driven reasoning loop over shared personal memory."
requires-python = ">=3.11"
dependencies = [
    "anthropic[vertex]>=1.0",
    "google-genai>=1.30",
    "google-play-scraper>=1.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
postgres = ["asyncpg>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quintessa*"]

[tool.setuptools.package-data]
quintessa = ["capabilities/*.md", "prompts/*.md", "prompts/jev/*.yaml", "samples/*.json", "tools/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP042"]  # (str, Enum) keeps today's str() of members; StrEnum would change it
