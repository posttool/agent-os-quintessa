# The three score questions Jev answers for each card (quintessa/decide/card_scorer.py).
# Each criteria list runs from the lowest score to the highest.
urgency:
  type: score
  instructions: >-
    How much personal risk does the user take on if they do not act on this card?
  criteria:
  - >-
    Ambient or routine: a daily brief, an FYI, a screen time or health report.
  - Good to know soon, but nothing is lost by waiting.
  - >-
    A perishable window: rain starting where they are in minutes, a 2FA code, a missed important call,
    a subscription about to lapse.
  - >-
    A hard commitment today: a meeting, a flight, a delivery, a paid event, a visit from a tradesperson.
  - >-
    A hard commitment happening now: a meeting starting in minutes, boarding has begun, the courier is
    outside.
relevance:
  type: score
  instructions: >-
    How well does this card fit the user's context right now: where they are, the time of day, and what
    they have just been doing?
  criteria:
  - >-
    Out of place now: about another place or time of day, or they are asleep or busy with something else.
  - Could matter now, but nothing in their context points to it.
  - 'Fits their context: the right place or time of day for it.'
  - Exactly what their context calls for right now.
affinity:
  type: score
  instructions: >-
    How much does the person or business this card is about matter to the user?
  criteria:
  - A stranger, a brand or an automated sender.
  - An acquaintance or a service they use now and then.
  - >-
    Someone they deal with often: a colleague, a friend, a regular service.
  - 'Their closest people: partner, family, close friends, their manager.'
